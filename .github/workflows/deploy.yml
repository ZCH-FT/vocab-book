name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 本次推送的提交清单
        continue-on-error: true
        env:
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          commits=$(echo "$COMMITS" | jq -c 'if . == null then [] else . end')
          n=$(echo "$commits" | jq 'length')
          {
            echo "## 本次推送携带 ${n} 个提交"
            echo ""
            echo "| # | Commit | 说明 |"
            echo "|---|---|---|"
            echo "$commits" | jq -r 'to_entries[] | "| \(.key + 1) | `\(.value.id[0:7])` | \(.value.message | split("\n")[0]) |"'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/vocab-book/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
